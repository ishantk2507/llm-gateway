# Scrapes the gateway's own /v1/metrics (not /metrics — everything lives
# under /v1, DESIGN.md §7).
global:
  scrape_interval: 5s        # tight for a local demo; loosen for real deployments
  evaluation_interval: 5s

scrape_configs:
  - job_name: llm-gateway
    metrics_path: /v1/metrics
    static_configs:
      - targets: ["gateway:8000"]