# CI — lint + full test suite.
#
# No service containers, no network: every test runs against MockProvider,
# fakeredis, and respx-recorded HTTP fixtures (ADR-0006). That constraint is
# what keeps this fast — if a test needs a live API, the test is wrong.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies (locked)
        run: uv sync --frozen --dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .   # drop this line if it fights you

      - name: Test
        run: uv run pytest --cov=llm_gateway --cov-report=term-missing