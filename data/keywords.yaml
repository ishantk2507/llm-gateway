# ADR-0001: the router's entire configuration — data, not code.
# FIRST MATCH WINS; order is semantic: premium rules (most specific) first,
# then tightly-constrained cheap rules, then standard catch-alls, then default.
# Keywords match on word boundaries, case-insensitive, against the last user
# message. The iteration loop is editing THIS FILE, never code.
#
# Structure notes:
# - trivially_short was DELETED: its unique coverage ("What's 2+2?") is already
#   held by simple_factual, while its ≤5-token window devoured every short
#   concept question ("What is OAuth?"). It was the engine of the 398
#   standard→cheap errors.
# - "design a" AND "design an" are both listed because \bdesign a\b can never
#   match "design an" — between a and n there is no word boundary. Same for create.
# - simple_factual's not_keywords are the label-alignment partners: the domain
#   terms listed there are exactly the "What is X?" prompts labeled standard in
#   the golden set (needs-a-paragraph concepts, not one-liner facts).

default_tier: standard

rules:
  # ── premium ────────────────────────────────────────────────────────────
  - name: code_task
    tier: premium
    any_keywords:
      [write a function, write a program, write a script, write code,
       write a class, write a method, write a test, write tests,
       write a query, write a command, write a dockerfile, write me a,
       write the code, write some code, create a function, implement,
       refactor, debug this, fix this code, fix this bug, fix the bug,
       fix this error, fix this python, fix this java, fix this javascript,
       fix this sql, sql query, regex, regular expression, unit test]
  - name: write_code_with_language
    tier: premium
    all_keywords: [write]
    any_keywords: [python, javascript, typescript, java, bash, shell,
                   sql, c++, rust, golang, dockerfile]
  - name: build_code_with_language
    tier: premium
    all_keywords: [build]
    any_keywords: [python, javascript, typescript, java, bash, shell,
                   sql, c++, rust, golang, dockerfile]
  - name: has_code_block
    tier: premium
    has_code: true
  - name: deep_reasoning
    tier: premium
    any_keywords:
      [prove, derive, step by step, walk me through, analyze, compare,
       recommend, trade-offs, trade offs, design, plan a, plan an,
       create a, create an, architect, how would you design, calculate,
       solve for, study plan, trace, diagnose, optimize, propose, choose,
       identify, evaluate, justify, normalize]
  - name: long_and_complex
    tier: premium
    min_tokens: 400
  - name: math_heavy
    tier: premium
    any_keywords: [integral, derivative, matrix, theorem, asymptotic, complexity]
    min_tokens: 
  - name: explain_multi_concept
    tier: premium
    any_keywords: [explain]
    min_tokens: 12   # calibrated: longest standard-labeled explain prompt in the
                     # golden set is 9 tokens; shortest multi-concept premium one
                     # is 13. Long explain = multi-part, per rubric rule 4.

  # ── cheap — constraints are tight so they can't steal explain-type prompts ──
  - name: greeting
    tier: cheap
    any_keywords: [hi, hello, hey, thanks, thank you, good morning, good evening, yo]
    max_tokens: 8
  - name: translate_short
    tier: cheap
    any_keywords: [translate]
    max_tokens: 10   # "Translate 'good morning' to Spanish." ✓; the five-page contract falls through to standard
  - name: simple_factual
    tier: cheap
    any_keywords:
      [what is, what's, what does, what color, what language, what planet,
       what gas, who is, who was, who wrote, when did, when was, where is,
       how many, how much, capital of, define, spell, name]
    max_tokens: 20
    not_keywords:
      # markers — anything signaling comparison/explanation is not one-shot
      [explain, describe, summarize, analyze, compare, difference between,
       differences between, why, how does, causes, caused,
       # domain — needs-a-paragraph concepts labeled standard in the golden set
       oauth, kubernetes, graphql, raft, jwt, deadlock, mutex, semaphore,
       dependency injection, eventual consistency, normalization, indexing,
       encryption, process, thread, transformer, embedding, overfitting,
       cross-validation, consistency, scaling, microservice, monolith, replica,
       firewall, vector, gradient, compiler, recursion, docker, cache, caching,
       queue, transaction, machine learning, neural, object-oriented,
       programming, world war, tides, opportunity cost,        hash, confusion matrix, big-o, binary tree, observability, idempotent,
       file system, load balancer, load balancing, cdn, circuit breaker,
       rest api, endpoint, machine translation, proof, index, migration,
       blue-green]

  # ── standard ───────────────────────────────────────────────────────────
  - name: explain_concept
    tier: standard
    any_keywords: [explain, describe, summarize, outline, draft, rewrite,
                   difference between, differences between, why does, how does]
  - name: structured_transform
    tier: standard
    has_structured_data: true